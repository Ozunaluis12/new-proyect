name: Backup diario de la base de datos

# Corre en la infraestructura de GitHub (no depende de que Render esté
# despierto). Genera un dump completo de PostgreSQL y lo sube a Cloudflare
# R2, en el mismo bucket que las evidencias pero en su propia carpeta.
on:
  schedule:
    - cron: "0 8 * * *" # 03:00 hora Colombia (UTC-5)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 18
        # pg_dump exige que la version del cliente sea >= la del servidor.
        # Render corre PostgreSQL 18, pero el paquete "postgresql-client" por
        # defecto de Ubuntu trae la v16; se agrega el repositorio oficial de
        # PGDG para instalar la v18 exacta. El AWS CLI ya viene preinstalado
        # en el runner, no hace falta instalarlo.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Generar respaldo
        run: |
          set -euo pipefail
          FECHA=$(date +%Y-%m-%d)
          echo "ARCHIVO=loginova-$FECHA.dump" >> "$GITHUB_ENV"
          # El runner ya trae postgresql-client-16 preinstalado, y el
          # "pg_dump" genérico del PATH sigue resolviendo a esa versión
          # aunque se instale la 18 al lado; se invoca el binario de la
          # v18 por su ruta completa para evitar la ambigüedad.
          /usr/lib/postgresql/18/bin/pg_dump "${{ secrets.BACKUP_DATABASE_URL }}" --format=custom --file="loginova-$FECHA.dump"

      - name: Subir respaldo a Cloudflare R2
        run: |
          set -euo pipefail
          aws s3 cp "$ARCHIVO" "s3://${{ secrets.R2_BUCKET_NAME }}/db-backups/$ARCHIVO" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
